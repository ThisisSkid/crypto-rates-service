services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Именованный том. Без него docker compose down уносит историю курсов,
      # и min/max за день с процентом за час считать не из чего.
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_create_rates.up.sql:/docker-entrypoint-initdb.d/000001_create_rates.sql:ro
    healthcheck:
      # pg_isready внутри контейнера. $$ оставляет переменную контейнеру, compose её не подставляет.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
