stages:
  - test
  - publish

# CI: GitLab сам гоняет тесты на каждый push.
# -race ловит гонки в тикере и боте, -cover показывает покрытие в логе job.
test:
  stage: test
  image: golang:1.25
  script:
    - go vet ./...
    - go test -race -cover ./...

# CD: после зелёных тестов образ собирается и уходит в GitLab Container Registry.
# Тег SHA есть у каждой сборки, latest переставляется только на дефолтной ветке.
publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - test
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
